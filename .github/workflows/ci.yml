# CI for delivery-agent-team-tools: the frozen-API `build-helpers` CLI the
# delivery-agent-team plugin's build-with-team/plan-with-team skills invoke.
#
# go.mod requires the claude-shared-tooling go/* modules at their real,
# independently tagged versions (no local replace) -- claude-shared-tooling
# is private, so `go build`/`go vet`/`go test`/`go mod download` need GOPRIVATE
# set (skip the public proxy + checksum db for that module path) and a git
# credential for it. SIBLING_REPO_TOKEN (a PAT scoped to that repo) is wired
# in via `git config url.insteadOf`, the same token used previously for the
# sibling checkout this replaced.
#
# guardrail gates every other job: SC-VERSIONING (tag-prefix.sh, tag pushes
# only) and SC-DISTRIBUTION (no-committed-binaries.sh, every run).

name: CI

on:
  push:
    branches: [main]
    # A release tag (vX.Y.Z) fires the workflow so tag-prefix.sh runs at tag-push time.
    tags: ['*']
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  guardrail:
    name: guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No committed binaries (SC-DISTRIBUTION)
        run: bash .github/workflows/scripts/no-committed-binaries.sh .

      - name: Tag conforms to SC-VERSIONING
        if: startsWith(github.ref, 'refs/tags/')
        run: bash .github/workflows/scripts/tag-prefix.sh "${GITHUB_REF_NAME}"

  build-test:
    name: build-test
    runs-on: ubuntu-latest
    needs: guardrail
    env:
      GOPRIVATE: github.com/johnrichter/claude-shared-tooling
    defaults:
      run:
        working-directory: delivery-agent-team-tools
    steps:
      - uses: actions/checkout@v5
        with:
          path: delivery-agent-team-tools

      - name: Git credential for private claude-shared-tooling module fetches
        run: git config --global url."https://x-access-token:${{ secrets.SIBLING_REPO_TOKEN }}@github.com/johnrichter/claude-shared-tooling".insteadOf "https://github.com/johnrichter/claude-shared-tooling"

      - uses: actions/setup-go@v5
        with:
          go-version-file: delivery-agent-team-tools/go.mod

      - name: gofmt --check
        run: |
          fmt_diff="$(gofmt -l .)"
          if [ -n "$fmt_diff" ]; then
            echo "$fmt_diff"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -trimpath -ldflags='-s -w' -o /dev/null ./cmd/build-helpers

      - name: go test
        run: go test ./...

  plugin-swap-check:
    name: plugin-swap-check
    runs-on: ubuntu-latest
    needs: guardrail
    env:
      GOPRIVATE: github.com/johnrichter/claude-shared-tooling
    defaults:
      run:
        working-directory: delivery-agent-team-tools
    steps:
      - uses: actions/checkout@v5
        with:
          path: delivery-agent-team-tools

      - name: Git credential for private claude-shared-tooling module fetches
        run: git config --global url."https://x-access-token:${{ secrets.SIBLING_REPO_TOKEN }}@github.com/johnrichter/claude-shared-tooling".insteadOf "https://github.com/johnrichter/claude-shared-tooling"

      - uses: actions/setup-go@v5
        with:
          go-version-file: delivery-agent-team-tools/go.mod

      - name: plugin-swap fixture verification (SC-DAT-FROZEN)
        run: bash plugin-swap/verify.sh
