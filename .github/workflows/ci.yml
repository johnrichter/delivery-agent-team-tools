# CI for delivery-agent-team-tools: the frozen-API `build-helpers` CLI the
# delivery-agent-team plugin's build-with-team/plan-with-team skills invoke.
#
# go.mod `replace`s the claude-shared-tooling modules onto ../ai-shared-lib/go/*
# (a monorepo-development stand-in until those modules are independently
# tagged -- see the `replace` block's comment in go.mod). actions/checkout
# refuses any path outside $GITHUB_WORKSPACE, so every job that runs
# `go build`/`go vet`/`go test` checks out both repos as workspace siblings
# (delivery-agent-team-tools, ai-shared-lib) and runs with
# working-directory: delivery-agent-team-tools, which resolves the replace
# target at ../ai-shared-lib exactly as a local dev checkout does.
# claude-shared-tooling is private, so the sibling checkout needs read access
# via SIBLING_REPO_TOKEN (a PAT scoped to that repo) rather than the default,
# repo-scoped GITHUB_TOKEN.
#
# guardrail gates every other job: SC-VERSIONING (tag-prefix.sh, tag pushes
# only) and SC-DISTRIBUTION (no-committed-binaries.sh, every run).

name: CI

on:
  push:
    branches: [main]
    # A release tag (vX.Y.Z) fires the workflow so tag-prefix.sh runs at tag-push time.
    tags: ['*']
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  guardrail:
    name: guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No committed binaries (SC-DISTRIBUTION)
        run: bash .github/workflows/scripts/no-committed-binaries.sh .

      - name: Tag conforms to SC-VERSIONING
        if: startsWith(github.ref, 'refs/tags/')
        run: bash .github/workflows/scripts/tag-prefix.sh "${GITHUB_REF_NAME}"

  build-test:
    name: build-test
    runs-on: ubuntu-latest
    needs: guardrail
    defaults:
      run:
        working-directory: delivery-agent-team-tools
    steps:
      - uses: actions/checkout@v5
        with:
          path: delivery-agent-team-tools

      - name: Checkout ai-shared-lib sibling (go.mod replace target)
        uses: actions/checkout@v5
        with:
          repository: johnrichter/claude-shared-tooling
          token: ${{ secrets.SIBLING_REPO_TOKEN }}
          path: ai-shared-lib

      - uses: actions/setup-go@v5
        with:
          go-version-file: delivery-agent-team-tools/go.mod

      - name: gofmt --check
        run: |
          fmt_diff="$(gofmt -l .)"
          if [ -n "$fmt_diff" ]; then
            echo "$fmt_diff"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -trimpath -ldflags='-s -w' -o /dev/null ./cmd/build-helpers

      - name: go test
        run: go test ./...

  plugin-swap-check:
    name: plugin-swap-check
    runs-on: ubuntu-latest
    needs: guardrail
    defaults:
      run:
        working-directory: delivery-agent-team-tools
    steps:
      - uses: actions/checkout@v5
        with:
          path: delivery-agent-team-tools

      - name: Checkout ai-shared-lib sibling (go.mod replace target)
        uses: actions/checkout@v5
        with:
          repository: johnrichter/claude-shared-tooling
          token: ${{ secrets.SIBLING_REPO_TOKEN }}
          path: ai-shared-lib

      - uses: actions/setup-go@v5
        with:
          go-version-file: delivery-agent-team-tools/go.mod

      - name: plugin-swap fixture verification (SC-DAT-FROZEN)
        run: bash plugin-swap/verify.sh
