# SC-DISTRIBUTION release: delivery-agent-team-tools cross-compiles itself into
# per-OS/arch archives + checksums and publishes them as the tag's official
# GitHub release. No matrix of runners is needed -- Go's cross-compilation
# builds every GOOS/GOARCH cell from one Linux host.
#
# Triggers on a vX.Y.Z tag push (SC-VERSIONING: tag prefix == module path from
# repo root, which is empty for this single, root-level module; guardrail's
# tag-prefix.sh enforces this in ci.yml on the same push). A manual
# workflow_dispatch run defaults to dry_run: true, so a change to this file
# can be exercised without cutting a tag or touching GitHub Releases.
#
# go.mod requires the claude-shared-tooling go/* modules at their real,
# independently tagged versions (no local replace -- see ci.yml's header for
# the GOPRIVATE + git-credential wiring this needs since that module is
# private).
#
# The archive/checksum layout here (v<version>/<name>_<version>_<os>_<arch>.tar.gz
# plus a shared v<version>/checksums.txt) is what plugin-swap/download-script.sh
# expects a release host to serve -- GitHub's own release-asset URLs already
# have the shape <base>/v<version>/<asset>, so PF_RELEASE_BASE_URL can point
# straight at this repo's releases/download root.
#
# This workflow re-runs tag-prefix.sh itself rather than trusting ci.yml's
# guardrail job: a tag push fires both workflows independently, and neither
# GitHub Actions run gates the other, so a malformed tag rejected by ci.yml
# would otherwise still reach `gh release create` here undisturbed.

name: SC-DISTRIBUTION release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build archives + checksums; skip the platform release."
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-publish:
    name: build-and-publish
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/johnrichter/claude-shared-tooling
    defaults:
      run:
        working-directory: delivery-agent-team-tools
    steps:
      - uses: actions/checkout@v5
        with:
          path: delivery-agent-team-tools

      - name: Tag conforms to SC-VERSIONING
        if: ${{ github.event_name == 'push' }}
        run: bash .github/workflows/scripts/tag-prefix.sh "${GITHUB_REF_NAME}"

      - name: Git credential for private claude-shared-tooling module fetches
        run: git config --global url."https://x-access-token:${{ secrets.SIBLING_REPO_TOKEN }}@github.com/johnrichter/claude-shared-tooling".insteadOf "https://github.com/johnrichter/claude-shared-tooling"

      - uses: actions/setup-go@v5
        with:
          go-version-file: delivery-agent-team-tools/go.mod

      # A tag push names the release directly; a manual dispatch has no tag, so it
      # synthesizes one for the archive filenames only -- dry_run always skips the
      # publish step below, so that placeholder never reaches a real release.
      - name: Resolve release tag + version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v0.0.0-dryrun.${GITHUB_RUN_ID}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Go's cross-compilation needs no native hardware per target -- every cell of this
      # matrix builds from the one Linux runner.
      - name: Cross-compile per-OS/arch archives + checksums
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          outdir="dist/${version}"
          mkdir -p "$outdir"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            bin="build-helpers"
            workdir="$(mktemp -d)"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "${workdir}/${bin}" ./cmd/build-helpers
            archive="${outdir}/build-helpers_${version}_${os}_${arch}.tar.gz"
            tar -czf "${archive}" -C "${workdir}" "${bin}"
            rm -rf "${workdir}"
          done
          ( cd "$outdir" && sha256sum build-helpers_*.tar.gz | sort -k2 > checksums.txt )
          ls -la "$outdir"

      - name: Publish the official release (per-OS/arch archives + checksums)
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}" --generate-notes "dist/${{ steps.version.outputs.version }}"/*.tar.gz "dist/${{ steps.version.outputs.version }}"/checksums.txt

      - name: Dry-run summary
        if: ${{ github.event_name != 'push' }}
        run: |
          echo "dry-run: built archives + checksums for ${{ steps.version.outputs.tag }} - publish skipped"
          ls -la "dist/${{ steps.version.outputs.version }}"
